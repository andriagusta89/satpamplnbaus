# Increase the heap size for the Gradle daemon
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Increase memory for the Kotlin daemon
kotlin.daemon.jvm.options=-Xmx2g

# Enable parallel execution and configuration caching for better performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android-specific settings
android.useAndroidX=true
android.nonTransitiveRClass=true
